name: OGResize
version: 1.4
main: org.ogcraft.ogresize.OGResize
api-version: 26.2
author: OJCream
load: STARTUP

commands:
  resize:
     description: Change player size
     usage: /resize | /resize [username] [size] | /resize help

permissions:
  ogresize.self:
    description: Allows player to change their own size
    default: op
  ogresize.others:
    description: Allows players to change other player's size
    default: op
  ogresize.admin:
    description: Allows for enabling/disabling/reloading of plugin
    default: op
